[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "StoryPipeline"
version = "0.1.0"
description = "A production-grade pipeline for generating personalized children's picture books."
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "diskcache>=5.6",
    "typing-extensions>=4.9",
    "python-docx>=1.0",
    "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"
